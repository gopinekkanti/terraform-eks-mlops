name: "Terraform GitOps Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read  # Required to checkout the repository
  pull-requests: write # Allows the bot to post plan outputs on PRs

env:
  AWS_REGION: "us-east-1" # Change to your preferred region
  AWS_ROLE_ARN: "arn:aws:iam::123456789012:role/github-actions-terraform-role" # Replace with your actual IAM OIDC Role
  TF_WORKING_DIR: "environments/dev"

jobs:
  terraform-ci:
    name: "Terraform Lint & Plan"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: \${{ env.TF_WORKING_DIR }}

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate securely to AWS via OIDC (No long-lived AWS keys needed!)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: \${{ env.AWS_ROLE_ARN }}
          aws-region: \${{ env.AWS_REGION }}
          audience: ://amazonaws.com

      # Step 3: Set up the specific Terraform version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # Step 4: Check if the code follows proper formatting standards
      - name: Terraform Format Check
        run: terraform fmt -check

      # Step 5: Initialize the Terraform directory and download providers/modules
      - name: Terraform Init
        run: terraform init

      # Step 6: Validate the structural correctness of configuration files
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Run security scanning using TFLint or TFSec (Highly valued by SRE teams)
      - name: Run TFLint
        uses: terraform-linters/tflint-actions@v2
        with:
          github_token: \${{ secrets.GITHUB_TOKEN }}
          working-directory: \${{ env.TF_WORKING_DIR }}

      # Step 8: Generate execution plan on Pull Requests
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -out=tfplan
        continue-on-error: false

      # Step 9: Post the Plan output directly into the PR comments for peer review
      - name: Update Pull Request with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: \${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌
            #### Terraform Initialization ⚙️
            #### Terraform Validation 🤖
            #### Terraform Plan 📖
            
            <details><summary>Show Plan Output</summary>
            
            \`\`\`hcl
            \${process.env.TF_PLAN_OUTPUT}
            \`\`\`
            
            </details>
            
            *Pushed by: @${context.actor}, Action: \`\${context.eventName}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-cd:
    name: "Terraform Apply"
    needs: terraform-ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: \${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: \${{ env.AWS_ROLE_ARN }}
          aws-region: \${{ env.AWS_REGION }}
          audience: ://amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      # Step 10: Auto-apply the infrastructure changes when code merges into Main
      - name: Terraform Apply
        run: terraform apply -auto-approve
